name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Test Rust workspace
        run: cargo test --workspace -- --test-threads=1
      - name: Build the debug binary used by e2e
        run: cargo build
      - name: End-to-end mock provider tests
        run: ./tests/e2e.sh
      - name: Test C crypto vectors
        run: make -C nano test_crypto
      - name: Clippy (deny-level lints only)
        run: cargo clippy --workspace --all-targets
      - name: Formatting
        run: cargo fmt --all --check

  # The unit and integration tests on the other two host families. Raw-mode,
  # console, process-tree and path code differ per OS and used to be checked
  # only by compiling.
  test-hosts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust workspace
        run: cargo test --workspace -- --test-threads=1

  # Run the whole test suite on foreign architectures under qemu-user:
  # 32-bit (i686, armv7), big-endian (s390x) and RISC-V catch word-size and
  # byte-order bugs in the hand-written crypto, TLS, JSON and FFI code.
  test-qemu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-unknown-linux-musl, qemu: qemu-aarch64, packages: "gcc-aarch64-linux-gnu", prefix: "" }
          - { target: armv7-unknown-linux-musleabihf, qemu: qemu-arm, packages: "gcc-arm-linux-gnueabihf", prefix: "" }
          - { target: i686-unknown-linux-musl, qemu: qemu-i386, packages: "gcc-i686-linux-gnu", prefix: "" }
          - { target: riscv64gc-unknown-linux-musl, qemu: qemu-riscv64, packages: "gcc-riscv64-linux-gnu", prefix: "" }
          - { target: s390x-unknown-linux-gnu, qemu: qemu-s390x, packages: "gcc-s390x-linux-gnu", prefix: "/usr/s390x-linux-gnu" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross linker and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }} qemu-user
      - name: Test Rust workspace under qemu
        shell: bash
        run: |
          runner_var="CARGO_TARGET_$(printf '%s' "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')_RUNNER"
          export "$runner_var=${{ matrix.qemu }}"
          if [ -n "${{ matrix.prefix }}" ]; then export QEMU_LD_PREFIX="${{ matrix.prefix }}"; fi
          # Doctests are left to the host jobs: rustdoc links them without
          # the target's crt-static flags, which fails on musl cross targets.
          cargo test --workspace --target ${{ matrix.target }} --lib --bins --tests -- --test-threads=1

  # Targets without a release artifact still have to compile: BSD and
  # illumos raw mode and winsize, Android, ppc64le termios, LoongArch, and
  # Windows on ARM. No linker is needed for cargo check.
  check-targets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-freebsd
          - x86_64-unknown-netbsd
          - x86_64-unknown-illumos
          - aarch64-linux-android
          - armv7-linux-androideabi
          - powerpc64le-unknown-linux-gnu
          - loongarch64-unknown-linux-musl
          - aarch64-pc-windows-gnullvm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check workspace
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}

  # rust-version in Cargo.toml, and Rust 1.77.2, the last release that
  # supports Windows 7 (scripts/build-legacy-win.sh). Cargo.lock must stay at
  # version 3 for these to parse it.
  msrv:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { toolchain: "1.74.1", target: x86_64-unknown-linux-gnu }
          - { toolchain: "1.77.2", target: x86_64-pc-windows-gnu }
          - { toolchain: "1.77.2", target: i686-pc-windows-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}
      - name: Check workspace
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}

  full-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, page: linux-x86_64, packages: "musl-tools", qemu: "", prefix: "" }
          - { target: i686-unknown-linux-musl, page: linux-i686, packages: "gcc-i686-linux-gnu", qemu: qemu-i386, prefix: "" }
          - { target: aarch64-unknown-linux-musl, page: linux-aarch64, packages: "gcc-aarch64-linux-gnu", qemu: qemu-aarch64, prefix: "" }
          - { target: armv7-unknown-linux-musleabihf, page: linux-armv7, packages: "gcc-arm-linux-gnueabihf", qemu: qemu-arm, prefix: "" }
          - { target: riscv64gc-unknown-linux-musl, page: linux-riscv64, packages: "gcc-riscv64-linux-gnu", qemu: qemu-riscv64, prefix: "" }
          - { target: s390x-unknown-linux-gnu, page: linux-s390x, packages: "gcc-s390x-linux-gnu", qemu: qemu-s390x, prefix: "/usr/s390x-linux-gnu" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }} qemu-user
      - name: Build full
        run: cargo build --release --target ${{ matrix.target }}
      - name: Smoke-run the release binary
        shell: bash
        run: |
          # The release profile (opt-level z, LTO, panic=abort) is not what
          # the tests run, so execute the shipped binary itself.
          bin="target/${{ matrix.target }}/release/emerag"
          if [ -n "${{ matrix.prefix }}" ]; then export QEMU_LD_PREFIX="${{ matrix.prefix }}"; fi
          run() { if [ -n "${{ matrix.qemu }}" ]; then ${{ matrix.qemu }} "$bin" "$@"; else "$bin" "$@"; fi; }
          run --version
          run --keys > /dev/null
          run --doctor --no-write > doctor.txt 2>&1 || true
          grep -q "terminal" doctor.txt
          echo /quit | run --no-write --base-url http://127.0.0.1:1/v1 --model x
      - name: Stage
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/emerag" "out/emerag-full-${{ matrix.page }}"
      - uses: actions/upload-artifact@v4
        with:
          name: full-${{ matrix.page }}
          path: out/*
          if-no-files-found: error

  lite-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, page: linux-x86_64, packages: "musl-tools" }
          - { target: i686-unknown-linux-musl, page: linux-i686, packages: "gcc-i686-linux-gnu" }
          - { target: aarch64-unknown-linux-musl, page: linux-aarch64, packages: "gcc-aarch64-linux-gnu" }
          - { target: armv7-unknown-linux-musleabihf, page: linux-armv7, packages: "gcc-arm-linux-gnueabihf" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross linker and UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }} upx-ucl
      - name: Build lite
        run: cargo build --profile size --features lite --bin emerag --target ${{ matrix.target }}
      - name: Pack and stage
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/size/emerag" "out/emerag-lite-${{ matrix.page }}"
          upx --best --lzma "out/emerag-lite-${{ matrix.page }}"
      - uses: actions/upload-artifact@v4
        with:
          name: lite-${{ matrix.page }}
          path: out/*
          if-no-files-found: error

  windows:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-gnu, page: windows-x86_64.exe, tier: full, profile: release, features: "" }
          - { target: i686-pc-windows-gnu, page: windows-x86.exe, tier: full, profile: release, features: "" }
          - { target: x86_64-pc-windows-gnu, page: windows-x86_64.exe, tier: lite, profile: size, features: "--features lite" }
          - { target: i686-pc-windows-gnu, page: windows-x86.exe, tier: lite, profile: size, features: "--features lite" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install MinGW and UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 upx-ucl
      - name: Build
        run: cargo build --profile ${{ matrix.profile }} ${{ matrix.features }} --bin emerag --target ${{ matrix.target }}
      - name: Stage
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/${{ matrix.profile }}/emerag.exe" "out/emerag-${{ matrix.tier }}-${{ matrix.page }}"
          if [ "${{ matrix.tier }}" = lite ]; then upx --best --lzma "out/emerag-${{ matrix.tier }}-${{ matrix.page }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tier }}-${{ matrix.page }}
          path: out/*
          if-no-files-found: error

  nano:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { page: linux-x86_64, cc: musl-gcc, zig: "" }
          - { page: linux-aarch64, cc: "", zig: aarch64-linux-musl }
          - { page: linux-armv7, cc: "", zig: arm-linux-musleabihf }
          - { page: linux-i686, cc: "", zig: x86-linux-musl }
          - { page: linux-riscv64, cc: "", zig: riscv64-linux-musl }
          - { page: windows-x86.exe, cc: i686-w64-mingw32-gcc, zig: "" }
          - { page: windows-x86_64.exe, cc: x86_64-w64-mingw32-gcc, zig: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers and UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools mingw-w64 upx-ucl
      - name: Install Zig for musl cross builds
        if: matrix.zig != ''
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
      - name: Build nano
        run: |
          mkdir -p out
          out="out/emerag-nano-${{ matrix.page }}"
          if [ -n "${{ matrix.zig }}" ]; then
            zig cc -target "${{ matrix.zig }}" -std=gnu89 -Os -static -Wall -Wextra \
              common.c crypto.c tls.c emerag.c -o "$out"
          elif [ "${{ matrix.page }}" = "linux-x86_64" ]; then
            musl-gcc -std=gnu89 -Os -static -Wall -Wextra \
              common.c crypto.c tls.c emerag.c -o "$out"
          else
            ${{ matrix.cc }} -std=gnu89 -Os -Wall -Wextra \
              common.c crypto.c tls.c emerag.c -o "$out" -lws2_32 -ladvapi32
          fi
          # UPX 4.2 does not support RISC-V; the raw static binary is still
          # small and remains a valid artifact.
          upx --best --lzma "$out" || echo "upx skipped: $out"
        working-directory: nano
      - uses: actions/upload-artifact@v4
        with:
          name: nano-${{ matrix.page }}
          path: nano/out/*
          if-no-files-found: error

  macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, target: x86_64-apple-darwin, page: macos-x86_64, tier: full, profile: release, features: "" }
          - { os: macos-15, target: aarch64-apple-darwin, page: macos-arm64, tier: full, profile: release, features: "" }
          - { os: macos-15-intel, target: x86_64-apple-darwin, page: macos-x86_64, tier: lite, profile: size, features: "--features lite" }
          - { os: macos-15, target: aarch64-apple-darwin, page: macos-arm64, tier: lite, profile: size, features: "--features lite" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --profile ${{ matrix.profile }} ${{ matrix.features }} --bin emerag --target ${{ matrix.target }}
      - name: Stage
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/${{ matrix.profile }}/emerag" "out/emerag-${{ matrix.tier }}-${{ matrix.page }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tier }}-${{ matrix.page }}
          path: out/*
          if-no-files-found: error

  rust9x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download rust9x toolchain
        run: |
          curl -fsSL -o /tmp/rust9x.tar.xz \
            https://github.com/rust9x/rust/releases/download/rust9x-1.99.1-v1/rust9x-1.99.1-v1-x86_64-unknown-linux-gnu.tar.xz
          tar -xJf /tmp/rust9x.tar.xz -C /tmp
          rustup toolchain link rust9x /tmp/rust9x-1.99.1-v1-x86_64-unknown-linux-gnu
      - name: Fetch MSVC CRT and SDK import libraries
        run: |
          cargo install xwin --locked
          xwin --accept-license --arch x86 --cache-dir "$PWD/.xwin-cache" splat --output "$PWD/sdk"
      - name: Build full and lite for 586/686
        run: |
          SDK="$PWD/sdk"
          export RUSTC_BOOTSTRAP=1
          export RUSTFLAGS="-C link-arg=/SUBSYSTEM:CONSOLE,4.0 -C link-arg=/OSVERSION:3.1 -C link-arg=/STACK:131072 -C target-feature=+crt-static -C link-arg=/LIBPATH:$SDK/crt/lib/x86 -C link-arg=/LIBPATH:$SDK/sdk/lib/um/x86 -C link-arg=/LIBPATH:$SDK/sdk/lib/ucrt/x86 -Zunicows=no"
          mkdir -p out
          build() {
            target="$1"; tier="$2"; page="$3"; profile="$4"; features="$5"
            linker_var="CARGO_TARGET_$(printf '%s' "$target" | tr 'a-z-' 'A-Z_')_LINKER"
            export "$linker_var=rust-lld"
            cargo +rust9x build --profile "$profile" $features --bin emerag --target "$target"
            cp "target/$target/$profile/emerag.exe" "out/emerag-$tier-$page"
          }
          build i586-rust9x-windows-msvc full legacy-windows-pentium.exe release ""
          build i586-rust9x-windows-msvc lite legacy-windows-pentium.exe size "--features lite"
          build i686-rust9x-windows-msvc full legacy-windows-x86.exe release ""
          build i686-rust9x-windows-msvc lite legacy-windows-x86.exe size "--features lite"
      - uses: actions/upload-artifact@v4
        with:
          name: rust9x
          path: out/*
          if-no-files-found: error

  tui-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: full-windows-x86_64.exe
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ConPTY driver
        run: python -m pip install pywinpty
      - name: Test arrows move the selection, and provider 11
        run: python tests/windows_tui.py

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, test-hosts, test-qemu, check-targets, msrv, full-linux, lite-linux, windows, nano, macos, rust9x, tui-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: site
          merge-multiple: true
      - name: Add page, installer and docs
        run: |
          cp www/index.html site/index.html
          mkdir -p site/docs
          cp docs/LEGACY.md site/docs/LEGACY.md
          cp scripts/install.sh site/install.sh
          chmod +x site/install.sh site/emerag-*
          (cd site && sha256sum emerag-* install.sh > SHA256SUMS)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
